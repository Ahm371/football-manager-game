<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>أنت المدرب</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101a16;color:white;font-family:Arial,sans-serif}
header{background:#12633d;padding:22px;text-align:center}
header h1{margin:0;font-size:27px}
header p{margin:8px 0 0;color:#d5f5df}
.stats{display:flex;justify-content:space-around;gap:8px;padding:12px}
.stat{background:#20352b;border-radius:12px;padding:12px;text-align:center;flex:1}
.stat b{display:block;color:#70f5a4;margin-top:7px}
main{padding:12px;max-width:650px;margin:auto}
h2{color:#7af0a5}
button,select{border:0;border-radius:9px;padding:12px;background:#18844c;color:white;font-size:15px;margin:4px;cursor:pointer}
button:active{opacity:.7}
.tabs{display:flex;flex-wrap:wrap;justify-content:center;background:#1b2922;padding:8px}
.panel{background:#1c2c23;border-radius:14px;padding:16px;margin-top:12px}
.player{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #405348;padding:12px 3px}
.player small{color:#a7c7b3}
.field{background:#28784b;border:5px solid #a4d9a8;border-radius:15px;padding:20px;text-align:center;margin-top:12px}
.notice{color:#a9e9bc;text-align:center;line-height:1.7}
.hidden{display:none}
select{width:100%;background:#30473a}
</style>
</head>
<body>

<header>
<h1>⚽ أنت المدرب</h1>
<p>كوّن فريقك.. واصنع تاريخك!</p>
</header>

<div class="stats">
<div class="stat">💰 الميزانية<b id="money">50 مليون</b></div>
<div class="stat">🏆 النقاط<b id="points">0</b></div>
<div class="stat">🎮 المباريات<b id="played">0</b></div>
</div>

<main>
<div class="panel">
<h2>اختار ناديك</h2>
<select id="club" onchange="changeClub()">
<option value="الأهلي">الأهلي</option>
<option value="الزمالك">الزمالك</option>
<option value="بيراميدز">بيراميدز</option>
<option value="ناديك الخاص">نادي خاص</option>
</select>
<p class="notice" id="welcome">أنت الآن مدرب الأهلي!</
